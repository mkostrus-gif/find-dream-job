[project]
name = "find-dream-job"
version = "0.1.0"
description = "An agent-first, local-first, DB-first control plane for private job search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Find Dream Job contributors" }]
keywords = ["job-search", "sqlite", "career", "dashboard", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []
