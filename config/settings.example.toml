# Agent: copy this template only through `jobctl.py init`, then edit the ignored
# local copy. Never place a real candidate's facts or credentials in this file.

[project]
title = "Мой поиск работы"
# Language for agent communication and generated output where supported.
locale = "ru"
# Часовой пояс IANA неизменно сохраняется в каждом долговечном плане ежедневного запуска.
timezone = "UTC"

[paths]
database = "data/job_search.sqlite"
dashboard = "dashboard/index.html"
views = "views"
reports = "reports"
archive = "archive"

[profile]
# All paths are private inputs and resolve against the selected workspace.
files = ["private/profile.md"]
preferences_file = "private/preferences.md"
scoring_file = "private/scoring.md"
answers_file = "private/questions_and_answers.md"

[automation]
# Safe default: search, score, recommend, and draft, but do not submit.
# Set true only after explicit user authorization for external submissions.
auto_apply = false
apply_threshold = 85
# Keep true even when submission is authorized.
require_visible_confirmation = true

[follow_up]
# Configuration limits what an agent may record. It does not authenticate a
# connector or grant permission to send a message.
limit = 3
interval_business_days = 5
primary_channel = "email"
direct_channels = ["linkedin"]
max_direct_messages_per_round = 1

[mail]
# Mail reads and mailbox mutations still require an authorized connector/session.
# Keep both false until the candidate explicitly enables the LinkedIn Inbox flow.
scan_linkedin_inbox = false
archive_processed_linkedin = false

[telegram]
# Public channel handles belong only in the ignored local settings file. The
# first completed scan covers this many calendar days; later plans use the
# durable per-channel post cursor and request only the delta.
enabled = false
initial_lookback_days = 30
channels = []

[search]
# A daily run is not complete until every configured stream has a validated
# coverage checkpoint. Replace these generic names in the ignored local copy.
required_streams = ["recommendations", "target_roles"]
default_period_days = 3
items_per_page = 100
# Keep personal recommendations as a separate fail-closed coverage stream when
# the selected source exposes one independently.
personal_recommendations_enabled = false
personal_recommendation_stream = "personal_recommendations"

[daily_run]
# Приватная рабочая область может добавить непрозрачные обязательные условия без
# изменения Engine. Зависимости указывают встроенный ключ шага либо ключ другого
# объявленного условия; публичные примеры остаются обобщёнными.
# [[daily_run.required_gates]]
# key = "additional_source"
# kind = "workspace_gate"
# order = 100
# depends_on = ["hh_coverage"]
# required = true
# enabled = true
# require_remote_boundary = true

[decision]
# All reusable metadata values are workspace-configured. Empty arrays are safe:
# historical or new rows remain explicitly unknown until a value is supplied.
campaign_ids = []
role_families = []
resume_ids = []
message_variants = []

[queue]
page_size = 50

[queue.limits]
urgent = 20
due_follow_up = 30
deep_review = 20
account_research = 10
backlog = 0

[queue.sla_days]
urgent = 1
due_follow_up = 2
deep_review = 5
account_research = 7
backlog = 30

[queue.labels]
urgent = "Срочный ответ работодателю или данные от пользователя"
due_follow_up = "Наступивший срок повторного обращения"
deep_review = "Углублённая проверка сильной возможности"
account_research = "Исследование целевого работодателя"
backlog = "Резерв вне активного лимита"

[policy]
# Exactly one effective screening policy is active in SQLite. Change both
# fields intentionally when screening rules change.
active_version = "engine-safe-default-v1"
effective_date = "2026-01-01"

[account]
active_portfolio_limit = 20

[source_stream_aliases]
# Optional exact raw alias -> one or more canonical reporting keys.
# Raw source_hits.source_stream values are always preserved. Keep this empty
# when no historical aliases need consolidation.
# "Legacy Product Stream" = "product_roles"
# "Campaign Alpha + Campaign Beta" = ["campaign_alpha", "campaign_beta"]

[channel_labels]
company_site = "Сайт работодателя"
email = "Почта"
linkedin = "LinkedIn"
