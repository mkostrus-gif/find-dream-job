<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Синтетическая вакансия</title>
  </head>
  <body>
    <main>
      <h1 data-qa="vacancy-title">Синтетическая продуктовая роль A</h1>
      <div data-qa="vacancy-company-name">Тестовая организация A</div>
      <div data-qa="vacancy-salary">Синтетический диапазон</div>
      <div data-qa="vacancy-view-location">Тестовая локация</div>
      <div data-qa="vacancy-view-employment-mode">Удалённо, полный день</div>
      <div data-qa="vacancy-experience">Синтетический уровень</div>
      <article data-qa="vacancy-description">Синтетическое описание без данных реальной вакансии.</article>
      <span data-qa="skills-element">Синтетический навык</span>
      <time data-qa="vacancy-creation-time" datetime="2026-08-19">19 августа</time>
    </main>
    <pre id="adapter-result">pending</pre>
    <script type="module">
      const adapterSource = await fetch("/scripts/hh_browser_adapter.js").then((response) => response.text());
      const adapter = (0, eval)(adapterSource);
      adapter.captureVacancyDetail().then((capture) => {
        document.querySelector("#adapter-result").textContent = JSON.stringify(capture);
      }).catch((error) => {
        document.querySelector("#adapter-result").textContent = JSON.stringify({error: String(error)});
      });
    </script>
  </body>
</html>
